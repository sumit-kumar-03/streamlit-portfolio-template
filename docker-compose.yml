services:
  portfolio:
    image: portfolio:latest
    build: .
    # Mount the project so edits show up without rebuilding the image.
    # Streamlit reloads on save (runOnSave in .streamlit/config.toml).
    volumes:
      - ./:/usr/src/app/
    ports:
      - "8081:8501"
    restart: unless-stopped
    dns:
      - 8.8.8.8
